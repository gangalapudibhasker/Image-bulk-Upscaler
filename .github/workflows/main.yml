name: Professional AI Book Image Enhancement Suite CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install lightweight test dependencies
        run: |
          pip install flake8 pytest pytest-cov pyyaml

      - name: Check Python Syntax
        run: python -m compileall .

      - name: Run Lint
        run: |
          flake8 . \
            --count \
            --statistics \
            --max-line-length=100 \
            --exclude=.git,__pycache__,venv,.venv,output,extracted,enhanced,reports,models

      - name: Run Tests
        run: pytest tests --cov=. --cov-report=term-missing

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/
            .pytest_cache/
          if-no-files-found: ignore
